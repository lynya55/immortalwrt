name: Build Audio Packages Only (no ffmpeg)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget subversion fakeroot libfakeroot zstd

      - name: Download SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-sdk-armsr-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst $SDK_URL
          tar --zstd -xvf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Build Audio Packages Only
        run: |
          cd sdk
          ./scripts/feeds update -a
          
          # Устанавливаем только аудио-пакеты
          ./scripts/feeds install libfdk-aac
          ./scripts/feeds install libopus
          ./scripts/feeds install libvorbis
          ./scripts/feeds install alsa-utils
          ./scripts/feeds install libsoxr

          # Генерируем конфиг ТОЛЬКО для аудио
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          CONFIG_BUILD_PATENTED=y
          CONFIG_USE_APK=y

          # Только аудио-библиотеки и утилиты
          CONFIG_PACKAGE_libfdk-aac=y
          CONFIG_PACKAGE_libopus=y
          CONFIG_PACKAGE_libvorbis=y
          CONFIG_PACKAGE_alsa-utils=y
          CONFIG_PACKAGE_libsoxr=y
          CONFIG_PACKAGE_libsamplerate=y
          CONFIG_PACKAGE_libsndfile=y
          
          # Дополнительные аудио-кодеки (на всякий случай)
          CONFIG_PACKAGE_libmp3lame=y
          CONFIG_PACKAGE_libtwolame=y
          CONFIG_PACKAGE_libflac=y
          
          # Опционально: если нужны аудио-драйверы
          # CONFIG_PACKAGE_kmod-sound-core=y
          # CONFIG_PACKAGE_kmod-sound-arm=y
          EOF

          make defconfig

          # Собираем только аудио-пакеты
          echo "=== Building libfdk-aac ==="
          make package/feeds/packages/libfdk-aac/compile V=s -j$(nproc)

          echo "=== Building libopus ==="
          make package/feeds/packages/libopus/compile V=s -j$(nproc)

          echo "=== Building libvorbis ==="
          make package/feeds/packages/libvorbis/compile V=s -j$(nproc)

          echo "=== Building alsa-utils ==="
          make package/feeds/packages/alsa-utils/compile V=s -j$(nproc)

          echo "=== Building libsoxr ==="
          make package/feeds/packages/libsoxr/compile V=s -j$(nproc)

          echo "=== Building libsamplerate ==="
          make package/feeds/packages/libsamplerate/compile V=s -j$(nproc)

          echo "=== Building libsndfile ==="
          make package/feeds/packages/libsndfile/compile V=s -j$(nproc)

          echo "=== Building libmp3lame ==="
          make package/feeds/packages/libmp3lame/compile V=s -j$(nproc)

      - name: List built audio packages
        run: |
          echo "=== Searching for audio packages ==="
          find sdk/bin/ -name "*fdk-aac*" -type f
          find sdk/bin/ -name "*libopus*" -type f
          find sdk/bin/ -name "*libvorbis*" -type f
          find sdk/bin/ -name "*alsa-utils*" -type f
          find sdk/bin/ -name "*libsoxr*" -type f
          find sdk/bin/ -name "*libsamplerate*" -type f
          find sdk/bin/ -name "*libsndfile*" -type f
          find sdk/bin/ -name "*libmp3lame*" -type f
          echo "=== All built packages ==="
          ls -la sdk/bin/packages/aarch64_generic/packages/ || echo "Directory not found"

      - name: Upload Audio Packages Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.0
        with:
          name: immortalwrt-audio-packages
          path: |
            sdk/bin/packages/aarch64_generic/packages/libfdk-aac*.apk
            sdk/bin/packages/aarch64_generic/packages/libopus*.apk
            sdk/bin/packages/aarch64_generic/packages/libvorbis*.apk
            sdk/bin/packages/aarch64_generic/packages/alsa-utils*.apk
            sdk/bin/packages/aarch64_generic/packages/libsoxr*.apk
            sdk/bin/packages/aarch64_generic/packages/libsamplerate*.apk
            sdk/bin/packages/aarch64_generic/packages/libsndfile*.apk
            sdk/bin/packages/aarch64_generic/packages/libmp3lame*.apk
            sdk/bin/packages/aarch64_generic/packages/libtwolame*.apk
            sdk/bin/packages/aarch64_generic/packages/libflac*.apk
          if-no-files-found: warn
