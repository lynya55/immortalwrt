name: Build Audio Packages Only (no ffmpeg)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget subversion fakeroot libfakeroot zstd

      - name: Download SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-sdk-armsr-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst $SDK_URL
          tar --zstd -xvf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Build Audio Packages Only
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Создаем конфиг с правильными путями
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          CONFIG_BUILD_PATENTED=y
          CONFIG_USE_APK=y

          # Аудио библиотеки (используем правильные имена пакетов)
          CONFIG_PACKAGE_libfdkaac=y
          CONFIG_PACKAGE_libopus=y
          CONFIG_PACKAGE_libvorbis=y
          CONFIG_PACKAGE_alsa-lib=y
          CONFIG_PACKAGE_alsa-utils=y
          CONFIG_PACKAGE_libsoxr=y
          CONFIG_PACKAGE_libsamplerate=y
          CONFIG_PACKAGE_libsndfile=y
          CONFIG_PACKAGE_libmp3lame=y
          CONFIG_PACKAGE_libtwolame=y
          CONFIG_PACKAGE_libflac=y
          EOF

          make defconfig

          # Собираем пакеты (используем правильные пути)
          echo "=== Building audio packages ==="
          make package/feeds/packages/libfdkaac/compile V=s -j$(nproc) || echo "libfdkaac not found, skipping..."
          make package/feeds/packages/libopus/compile V=s -j$(nproc) || echo "libopus not found, skipping..."
          make package/feeds/packages/libvorbis/compile V=s -j$(nproc) || echo "libvorbis not found, skipping..."
          make package/feeds/packages/alsa-lib/compile V=s -j$(nproc) || echo "alsa-lib not found, skipping..."
          make package/feeds/packages/alsa-utils/compile V=s -j$(nproc) || echo "alsa-utils not found, skipping..."
          make package/feeds/packages/libsoxr/compile V=s -j$(nproc) || echo "libsoxr not found, skipping..."
          make package/feeds/packages/libsamplerate/compile V=s -j$(nproc) || echo "libsamplerate not found, skipping..."
          make package/feeds/packages/libsndfile/compile V=s -j$(nproc) || echo "libsndfile not found, skipping..."
          make package/feeds/packages/libmp3lame/compile V=s -j$(nproc) || echo "libmp3lame not found, skipping..."
          make package/feeds/packages/libtwolame/compile V=s -j$(nproc) || echo "libtwolame not found, skipping..."
          make package/feeds/packages/libflac/compile V=s -j$(nproc) || echo "libflac not found, skipping..."

      - name: List built packages
        run: |
          echo "=== Searching for audio packages ==="
          find sdk/bin/ -name "*.apk" -type f | grep -E "(fdk|opus|vorbis|alsa|soxr|samplerate|sndfile|mp3|lame|twolame|flac)"
          echo "=== All built packages ==="
          ls -la sdk/bin/packages/aarch64_generic/packages/ 2>/dev/null || echo "Directory not found"
          ls -la sdk/bin/targets/armsr/armv8/packages/ 2>/dev/null || echo "Directory not found"

      - name: Upload Audio Packages Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.0
        with:
          name: immortalwrt-audio-packages
          path: |
            sdk/bin/packages/aarch64_generic/packages/*.apk
            sdk/bin/targets/armsr/armv8/packages/*.apk
          if-no-files-found: warn
