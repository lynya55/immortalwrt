name: Build FFmpeg with libx264

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get clean

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
          file wget subversion fakeroot libfakeroot

    - name: Update and Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Configuration
      run: |
        # Базовая архитектура Arm SystemReady / ARMv8 / AArch64
        echo "CONFIG_TARGET_armsr=y" > .config
        echo "CONFIG_TARGET_armsr_armv8=y" >> .config
        echo "CONFIG_TARGET_armsr_armv8_Default=y" >> .config
        
        # Разрешаем сборку запатентованных и GPL пакетов (Критично для x264)
        echo "CONFIG_BUILD_PATENTED=y" >> .config
        
        # Задаем современный менеджер пакетов APK
        echo "CONFIG_PACKAGE_MANAGEMENT_apk=y" >> .config
        
        # Включаем FFmpeg и библиотеку libx264
        echo "CONFIG_PACKAGE_ffmpeg=y" >> .config
        echo "CONFIG_PACKAGE_libx264=y" >> .config
        
        # Выбираем кастомную сборку ffmpeg со всеми лицензиями
        echo "CONFIG_PACKAGE_libffmpeg-custom=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_PATENTED=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_GPL=y" >> .config
        
        # Принудительно заставляем ffmpeg слинковаться с libx264 и включить h264
        echo "CONFIG_FFMPEG_CUSTOM_SELECT_libx264=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_DECODER_h264=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_ENCODER_libx264=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_DEMUXER_h264=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_MUXER_h264=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_PARSER_h264=y" >> .config
        
        make defconfig

    - name: Compile Toolchain and Tools
      run: |
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)

    - name: Compile FFmpeg Package
      run: |
        # Собираем x264 и ffmpeg с выводом логов компиляции
        make package/feeds/packages/ffmpeg/compile V=s -j$(nproc)

    - name: Upload Artifacts
      if: always() # Выгрузит артефакты в любом случае
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.0
      with:
        name: immortalwrt-ffmpeg-packages
        path: bin/targets/armsr/armv8/packages/
