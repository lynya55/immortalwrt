name: Build FFmpeg with libx264

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get clean

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        # Используем официальный скрипт инициализации окружения от ImmortalWrt
        sudo bash -c 'bash <(curl -s https://immortalwrt.org)'
        # Доставляем специфичные утилиты для APK-менеджера, если они доступны
        sudo apt-get install -y fakeroot libfakeroot || true

    - name: Update and Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Configuration
      run: |
        echo "CONFIG_TARGET_armsr=y" > .config
        echo "CONFIG_TARGET_armsr_armv8=y" >> .config
        echo "CONFIG_TARGET_armsr_armv8_Default=y" >> .config
        echo "CONFIG_BUILD_PATENTED=y" >> .config
        echo "CONFIG_PACKAGE_ffmpeg=y" >> .config
        echo "CONFIG_PACKAGE_libx264=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_PATENTED=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_GPL=y" >> .config
        echo "CONFIG_FFMPEG_CUSTOM_SELECT_libx264=y" >> .config
        echo "CONFIG_PACKAGE_MANAGEMENT_apk=y" >> .config
        make defconfig

    - name: Compile Toolchain and Tools
      run: |
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)

    - name: Compile FFmpeg Package
      run: |
        make package/feeds/packages/ffmpeg/compile V=s -j$(nproc)

    - name: Upload Artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.0
      with:
        name: immortalwrt-ffmpeg-packages
        path: bin/targets/armsr/armv8/packages/*.apk
