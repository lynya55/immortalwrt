name: Build FFmpeg with libx264

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget subversion fakeroot libfakeroot

      # 1. Скачиваем готовый SDK (а не собираем его!)
      - name: Download SDK
        run: |
          # Ссылка на SDK для вашей архитектуры (armsr/armv8)
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-sdk-armsr-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst $SDK_URL
          tar --zstd -xvf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Build FFmpeg Package
        run: |
          cd sdk
          # Обновляем фиды
          ./scripts/feeds update -a
          # Устанавливаем ТОЛЬКО ffmpeg и его зависимости
          ./scripts/feeds install ffmpeg
          # Генерируем минимальный конфиг с нужными опциями
          echo "CONFIG_TARGET_armsr=y" > .config
          echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" >> .config
          echo "CONFIG_BUILD_PATENTED=y" >> .config
          echo "CONFIG_USE_APK=y" >> .config
          echo "CONFIG_PACKAGE_ffmpeg=y" >> .config
          echo "CONFIG_PACKAGE_libx264=y" >> .config
          echo "CONFIG_FFMPEG_LIBX264=y" >> .config
          echo "CONFIG_FFMPEG_ENCODER_libx264=y" >> .config
          echo "CONFIG_FFMPEG_DECODER_h264=y" >> .config
          make defconfig
          # Собираем ТОЛЬКО ffmpeg (без ядра!)
          make package/feeds/packages/ffmpeg/compile V=s -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ffmpeg-packages
          path: sdk/bin/packages/aarch64_generic/base/*.ipk
