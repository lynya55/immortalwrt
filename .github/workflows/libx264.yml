name: Build FFmpeg with libx264

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget subversion fakeroot libfakeroot zstd

      - name: Download SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-sdk-armsr-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst $SDK_URL
          tar --zstd -xvf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Build libx264 and ffmpeg
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install libx264
          ./scripts/feeds install ffmpeg
          
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          CONFIG_BUILD_PATENTED=y
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_ffmpeg=y
          CONFIG_PACKAGE_libx264=y
          CONFIG_PACKAGE_libx264_asm=y
          CONFIG_FFMPEG_LIBX264=y
          CONFIG_FFMPEG_ENCODER_libx264=y
          CONFIG_FFMPEG_DECODER_h264=y
          EOF
          
          make defconfig
          echo "=== Building libx264 ==="
          make package/feeds/packages/libx264/compile V=s -j$(nproc)
          echo "=== Building ffmpeg ==="
          make package/feeds/packages/ffmpeg/compile V=s -j$(nproc)

      - name: List built packages
        run: |
          echo "=== Searching for libx264 ==="
          find sdk/bin/ -name "*libx264*" -type f
          echo "=== Searching for ffmpeg ==="
          find sdk/bin/ -name "*ffmpeg*" -type f
          echo "=== All built packages in target dir ==="
          ls -la sdk/bin/targets/armsr/armv8/packages/ || echo "Directory not found"

      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.0
        with:
          name: immortalwrt-ffmpeg-packages
          path: /home/runner/work/immortalwrt/immortalwrt/sdk/bin/packages/aarch64_generic/packages/
            sdk/bin/targets/armsr/armv8/packages/*.ipk
            sdk/bin/targets/armsr/armv8/packages/*.apk
          if-no-files-found: warn
