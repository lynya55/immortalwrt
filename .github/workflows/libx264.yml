name: Build FFmpeg with libx264, libfdk-aac and audio support

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget subversion fakeroot libfakeroot zstd

      - name: Download SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-sdk-armsr-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst $SDK_URL
          tar --zstd -xvf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Build FFmpeg with Full Audio Support
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Полный конфиг с аудио-поддержкой
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          CONFIG_BUILD_PATENTED=y
          CONFIG_USE_APK=y

          # Основные пакеты
          CONFIG_PACKAGE_ffmpeg=y
          CONFIG_PACKAGE_libffmpeg-full=y
          CONFIG_PACKAGE_libx264=y
          CONFIG_PACKAGE_libx264_asm=y
          
          # Аудио библиотеки
          CONFIG_PACKAGE_libfdkaac=y
          CONFIG_PACKAGE_libopus=y
          CONFIG_PACKAGE_libvorbis=y
          CONFIG_PACKAGE_libmp3lame=y
          CONFIG_PACKAGE_libsoxr=y
          CONFIG_PACKAGE_libsamplerate=y
          CONFIG_PACKAGE_libsndfile=y

          # Настройки FFmpeg - ВИДЕО
          CONFIG_FFMPEG_LIBX264=y
          CONFIG_FFMPEG_ENCODER_libx264=y
          CONFIG_FFMPEG_DECODER_h264=y
          CONFIG_FFMPEG_DECODER_hevc=y
          CONFIG_FFMPEG_PARSER_h264=y
          CONFIG_FFMPEG_PARSER_hevc=y
          CONFIG_FFMPEG_BSF_h264_mp4toannexb=y
          CONFIG_FFMPEG_BSF_hevc_mp4toannexb=y

          # Настройки FFmpeg - АУДИО (ВАЖНО!)
          CONFIG_FFMPEG_LIBFDK_AAC=y
          CONFIG_FFMPEG_ENCODER_libfdk_aac=y
          CONFIG_FFMPEG_DECODER_aac=y
          CONFIG_FFMPEG_PARSER_aac=y
          CONFIG_FFMPEG_BSF_aac_adtstoasc=y
          
          CONFIG_FFMPEG_LIBMP3LAME=y
          CONFIG_FFMPEG_ENCODER_libmp3lame=y
          CONFIG_FFMPEG_DECODER_mp3=y
          CONFIG_FFMPEG_PARSER_mp3=y
          
          CONFIG_FFMPEG_LIBOPUS=y
          CONFIG_FFMPEG_ENCODER_libopus=y
          CONFIG_FFMPEG_DECODER_opus=y
          CONFIG_FFMPEG_PARSER_opus=y

          # Протоколы RTSP/RTP
          CONFIG_FFMPEG_PROTOCOL_rtsp=y
          CONFIG_FFMPEG_DEMUXER_rtsp=y
          CONFIG_FFMPEG_MUXER_rtsp=y
          CONFIG_FFMPEG_DEMUXER_rtp=y
          CONFIG_FFMPEG_MUXER_rtp=y
          CONFIG_FFMPEG_DEMUXER_h264=y
          CONFIG_FFMPEG_DEMUXER_hevc=y
          CONFIG_FFMPEG_DEMUXER_aac=y
          CONFIG_FFMPEG_MUXER_aac=y
          EOF

          make defconfig

          # Собираем libfdkaac (обязательно перед ffmpeg)
          echo "=== Building libfdkaac ==="
          make package/feeds/packages/libfdkaac/compile V=s -j$(nproc)

          # Собираем остальные аудио-библиотеки
          echo "=== Building audio libraries ==="
          make package/feeds/packages/libopus/compile V=s -j$(nproc) || echo "libopus skipped"
          make package/feeds/packages/libvorbis/compile V=s -j$(nproc) || echo "libvorbis skipped"
          make package/feeds/packages/libmp3lame/compile V=s -j$(nproc) || echo "libmp3lame skipped"

          # Собираем libx264
          echo "=== Building libx264 ==="
          make package/feeds/packages/libx264/compile V=s -j$(nproc)

          # Собираем FFmpeg
          echo "=== Building FFmpeg ==="
          make package/feeds/packages/ffmpeg/compile V=s -j$(nproc)

      - name: List built packages
        run: |
          echo "=== Built packages ==="
          find sdk/bin/ -name "*.apk" -type f | grep -E "(ffmpeg|libfdk|libx264|libopus|libvorbis|libmp3lame)"
          ls -la sdk/bin/packages/aarch64_generic/packages/ 2>/dev/null || echo "Directory not found"
          ls -la sdk/bin/targets/armsr/armv8/packages/ 2>/dev/null || echo "Directory not found"

      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.0
        with:
          name: immortalwrt-ffmpeg-with-audio
          path: |
            sdk/bin/packages/aarch64_generic/packages/*.apk
            sdk/bin/targets/armsr/armv8/packages/*.apk
          if-no-files-found: warn
