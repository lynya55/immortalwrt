name: Build FFmpeg with libx264, HEVC and Kernel Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget subversion fakeroot libfakeroot zstd

      - name: Download SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-sdk-armsr-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst $SDK_URL
          tar --zstd -xvf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Build Kernel Modules and Packages
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install libx264
          ./scripts/feeds install ffmpeg

          # Генерируем конфиг для сборки модулей и пакетов
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          CONFIG_BUILD_PATENTED=y
          CONFIG_USE_APK=y

          # Включаем все нужные kmod-пакеты
          CONFIG_PACKAGE_kmod-video-meson-vdec=y
          CONFIG_PACKAGE_kmod-video-meson-venc=y
          CONFIG_PACKAGE_kmod-video-meson-common=y
          CONFIG_PACKAGE_kmod-media-controller=y
          CONFIG_PACKAGE_kmod-v4l2=y
          CONFIG_PACKAGE_kmod-v4l2-loopback=y
          CONFIG_PACKAGE_kmod-video-codec-meson=y
          CONFIG_PACKAGE_kmod-video-codec-meson-vdec=y

          # Включаем FFmpeg и libx264
          CONFIG_PACKAGE_ffmpeg=y
          CONFIG_PACKAGE_libx264=y
          CONFIG_PACKAGE_libx264_asm=y
          CONFIG_PACKAGE_libffmpeg-full=y

          # Настройки FFmpeg
          CONFIG_FFMPEG_LIBX264=y
          CONFIG_FFMPEG_ENCODER_libx264=y
          CONFIG_FFMPEG_DECODER_h264=y
          CONFIG_FFMPEG_DECODER_hevc=y
          CONFIG_FFMPEG_PARSER_h264=y
          CONFIG_FFMPEG_PARSER_hevc=y
          CONFIG_FFMPEG_BSF_h264_mp4toannexb=y
          CONFIG_FFMPEG_BSF_hevc_mp4toannexb=y
          CONFIG_FFMPEG_PROTOCOL_rtsp=y
          CONFIG_FFMPEG_DEMUXER_rtsp=y
          CONFIG_FFMPEG_MUXER_rtsp=y
          CONFIG_FFMPEG_DEMUXER_rtp=y
          CONFIG_FFMPEG_MUXER_rtp=y
          CONFIG_FFMPEG_DEMUXER_h264=y
          CONFIG_FFMPEG_DEMUXER_hevc=y
          EOF

          make defconfig

          # Собираем модули ядра через стандартную систему пакетов
          echo "=== Building kernel modules ==="
          make package/feeds/packages/linux/compile V=s -j$(nproc)

          # Собираем libx264
          echo "=== Building libx264 ==="
          make package/feeds/packages/libx264/compile V=s -j$(nproc)

          # Собираем FFmpeg
          echo "=== Building FFmpeg ==="
          make package/feeds/packages/ffmpeg/compile V=s -j$(nproc)

      - name: List built packages
        run: |
          echo "=== Searching for libx264 ==="
          find sdk/bin/ -name "*libx264*" -type f
          echo "=== Searching for FFmpeg ==="
          find sdk/bin/ -name "*ffmpeg*" -type f
          echo "=== Searching for kmod packages ==="
          find sdk/bin/ -name "kmod-*" -type f
          echo "=== All built packages in the known path ==="
          ls -la /home/runner/work/immortalwrt/immortalwrt/sdk/bin/packages/aarch64_generic/packages/ || echo "Directory not found"

      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.0
        with:
          name: immortalwrt-ffmpeg-and-modules
          path: |
            /home/runner/work/immortalwrt/immortalwrt/sdk/bin/packages/aarch64_generic/packages/*.apk
            /home/runner/work/immortalwrt/immortalwrt/sdk/bin/targets/armsr/armv8/packages/*.apk
          if-no-files-found: warn
